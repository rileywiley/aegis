{# Advanced — chunk seconds, silence threshold, API port, regenerate bearer. #}
{% set audio = toml.get("audio", {}) %}
{% set api = toml.get("api", {}) %}
<div class="space-y-4">

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <label class="block">
      <span class="text-xs font-medium text-gray-700">Audio chunk seconds (5–600)</span>
      <input type="number" min="5" max="600"
             name="audio.chunk_seconds"
             value="{{ audio.get('chunk_seconds', 30) }}"
             class="mt-1 w-full rounded-md border-gray-300 text-sm">
      <span class="text-xs text-gray-400">{{ field_label('audio', 'chunk_seconds') }}</span>
    </label>
    <label class="block">
      <span class="text-xs font-medium text-gray-700">Silence threshold (dB)</span>
      <input type="number" min="-120" max="0"
             name="audio.silence_threshold_db"
             value="{{ audio.get('silence_threshold_db', -50) }}"
             class="mt-1 w-full rounded-md border-gray-300 text-sm">
      <span class="text-xs text-gray-400">{{ field_label('audio', 'silence_threshold_db') }}</span>
    </label>
    <label class="block">
      <span class="text-xs font-medium text-gray-700">API port</span>
      <input type="number" min="1024" max="65535"
             name="api.port"
             value="{{ api.get('port', 3031) }}"
             class="mt-1 w-full rounded-md border-gray-300 text-sm">
      <span class="text-xs text-gray-400">{{ field_label('api', 'port') }}</span>
    </label>
  </div>

  <div class="rounded-lg border border-amber-200 bg-amber-50 p-3 space-y-2">
    <p class="text-sm font-medium text-amber-800">Bearer token</p>
    <p class="text-xs text-amber-700">
      Stored in <code>~/.aegis/capture.toml</code>. Regenerating logs out
      all running clients until they reload from disk.
    </p>
    <div class="flex items-center gap-2">
      <code class="rounded bg-amber-100 px-2 py-1 text-xs font-mono">••••••••••••••••</code>
      <button type="button"
              onclick="if (confirm('Regenerate the bearer token? This is a destructive action that will require all clients to reload.')) { alert('Regeneration not yet implemented — see HELIOS.md §13.7.'); }"
              class="rounded-md bg-amber-200 px-3 py-1 text-xs font-semibold text-amber-900 hover:bg-amber-300">
        Regenerate
      </button>
    </div>
  </div>
</div>
